# Delivery pricing for deliveryDistanceCalculator (POST /shipping-cost).
#
# Rates: Feb-2025 Villa Market model sheet ('proposal rate' tab) - stepped bands
# by straight-line km in three regional variants. Bands are inclusive of max_km;
# the first band covering the distance wins.
#
# Radii and the Sukhumvit 33 over-30 km line: product spec from Rong Ecommerce,
# 2026-08-15. See knowledge.villamarket.ai/reference/ship-by-distance-product-spec
#
# Keys (a per_branch entry inherits any key it omits from `default`):
#   tiers            banded rate card; first band whose max_km >= distance wins
#   over_km          linear tail past from_km: base + (km - from_km) * per_km
#                    (takes precedence over tiers, but only past from_km)
#   min_cost         floor applied after the band/line, before the cap
#   max_cost_cap     hard ceiling; also what the API reports as max_cost_cap
#   max_distance_km  beyond this the branch is not eligible -> Nationwide
#   cost_per_km      legacy THB/km line, used only if tiers and over_km are absent
#
# Region grouping is by province in appData/branchList.json plus Rong's explicit
# naming. shipping/branchMapping.yaml has a Zone field that agrees wherever it
# exists (31/31) but covers only 31 of 41 online branches - it is missing three
# Phuket stores (1050, 1056, 1057), so do not use it as the source of truth.
#
# Editing this file is live in ~5 minutes (CloudFront + 300s Lambda cache).

rate_cards:   # anchors only - the service reads `default` and `per_branch`
  bangkok: &bangkok   # Bangkok
    - { max_km: 2,  price: 65 }       # 0 < km <= 2
    - { max_km: 3,  price: 75 }       # 2 < km <= 3
    - { max_km: 5,  price: 85 }       # 3 < km <= 5
    - { max_km: 7,  price: 90 }       # 5 < km <= 7
    - { max_km: 10,  price: 115 }     # 7 < km <= 10
    - { max_km: 12,  price: 125 }     # 10 < km <= 12
    - { max_km: 15,  price: 135 }     # 12 < km <= 15
    - { max_km: 16,  price: 150 }     # 15 < km <= 16
    - { max_km: 20,  price: 180 }     # 16 < km <= 20
    - { max_km: 25,  price: 220 }     # 20 < km <= 25
    - { max_km: 27,  price: 250 }     # 25 < km <= 27
    - { max_km: 30,  price: 280 }     # 27 < km <= 30

  upcountry_resort: &upcountry_resort   # Hua-Hin / Pattaya / Udon
    - { max_km: 2,  price: 55 }       # 0 < km <= 2
    - { max_km: 5,  price: 75 }       # 2 < km <= 5
    - { max_km: 7,  price: 85 }       # 5 < km <= 7
    - { max_km: 10,  price: 100 }     # 7 < km <= 10
    - { max_km: 12,  price: 120 }     # 10 < km <= 12
    - { max_km: 15,  price: 140 }     # 12 < km <= 15
    - { max_km: 18,  price: 160 }     # 15 < km <= 18
    - { max_km: 20,  price: 180 }     # 18 < km <= 20
    - { max_km: 22,  price: 200 }     # 20 < km <= 22
    - { max_km: 24,  price: 220 }     # 22 < km <= 24
    - { max_km: 27,  price: 240 }     # 24 < km <= 27
    - { max_km: 30,  price: 260 }     # 27 < km <= 30

  phuket: &phuket   # Phuket
    - { max_km: 2,  price: 65 }       # 0 < km <= 2
    - { max_km: 3,  price: 75 }       # 2 < km <= 3
    - { max_km: 5,  price: 85 }       # 3 < km <= 5
    - { max_km: 7,  price: 100 }      # 5 < km <= 7
    - { max_km: 10,  price: 120 }     # 7 < km <= 10
    - { max_km: 12,  price: 135 }     # 10 < km <= 12
    - { max_km: 15,  price: 150 }     # 12 < km <= 15
    - { max_km: 17,  price: 170 }     # 15 < km <= 17
    - { max_km: 20,  price: 200 }     # 17 < km <= 20
    - { max_km: 22,  price: 220 }     # 20 < km <= 22
    - { max_km: 25,  price: 250 }     # 22 < km <= 25
    - { max_km: 27,  price: 270 }     # 25 < km <= 27
    - { max_km: 30,  price: 300 }     # 27 < km <= 30

