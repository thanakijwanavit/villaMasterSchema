$schema: http://json-schema.org/schema#
# example
#{
#    "basketId": "00000000-0000-4000-8000-000000000000",
#    "creationTime": 1625035961.717266,
#    "basketName": "00000000-0000-4000-8000-000000000000",
#    "ownerId": "00000000-0000-4000-8000-000000000000",
#    "productList": [
#        {
#            "sku": 247098,
#            "quantity": 3
#        }
#    ],
#    "branchId": "any"
#}

# additionalProperties: false
properties:
    basketId:
        type: string
    creationTime:
        type: number
    basketName:
        type: string
    ownerId:
        type: string
    productList:
        type: array
        items:
            type: object
            properties:
                sku:
                    type: number
                quantity:
                    type: number
    branchId:
        type: string
    currentOrder:
        type: object
        properties:
            orderId:
                type: string
            creationTime:
                type: number
required:
    - basketId
    - orderId
    - ownerId
type: object
